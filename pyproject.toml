[project]
name = "uplift-causal"
version = "0.1.0"
description = "Causal inference and uplift modeling on randomized marketing experiments"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "dowhy>=0.12",
    "econml>=0.15",
    "kaleido>=1.0",
    "lightgbm>=4.3",
    "networkx>=3.2",
    "numpy>=1.26",
    "pandas>=2.2",
    "plotly>=6.1",
    "pyarrow>=15",
    "scikit-learn>=1.4",
    "scipy>=1.12",
]

[dependency-groups]
dev = ["ipykernel", "jupyterlab", "nbconvert", "pytest", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/uplift_causal"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "NPY"]
ignore = ["E501"]
